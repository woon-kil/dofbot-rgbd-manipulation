<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900" font-family="sans-serif">
<rect width="700" height="900" fill="#fff"/>
<text x="20" y="28" font-size="20" font-weight="bold">세운 보드를 +y로 50 mm 밀기 — 위에서 본 도식(사진 아님)</text>
<text x="20" y="50" font-size="12" fill="#444">위=베이스(y 작음), 아래=사용자 쪽(+y), 오른쪽=+x. 폰은 왼쪽 먼 곳(x≈-316)에서 오른쪽을 본다. 단위 mm.</text>
<line x1="88.0" y1="70.0" x2="88.0" y2="814.0" stroke="#eee"/><text x="76.0" y="828.0" font-size="11" fill="#888">x=-40</text>
<line x1="184.0" y1="70.0" x2="184.0" y2="814.0" stroke="#eee"/><text x="172.0" y="828.0" font-size="11" fill="#888">x=0</text>
<line x1="280.0" y1="70.0" x2="280.0" y2="814.0" stroke="#eee"/><text x="268.0" y="828.0" font-size="11" fill="#888">x=40</text>
<line x1="376.0" y1="70.0" x2="376.0" y2="814.0" stroke="#eee"/><text x="364.0" y="828.0" font-size="11" fill="#888">x=80</text>
<line x1="472.0" y1="70.0" x2="472.0" y2="814.0" stroke="#eee"/><text x="460.0" y="828.0" font-size="11" fill="#888">x=120</text>
<line x1="40.0" y1="94.0" x2="544.0" y2="94.0" stroke="#eee"/><text x="4" y="98.0" font-size="11" fill="#888">y=100</text>
<line x1="40.0" y1="214.0" x2="544.0" y2="214.0" stroke="#eee"/><text x="4" y="218.0" font-size="11" fill="#888">y=150</text>
<line x1="40.0" y1="334.0" x2="544.0" y2="334.0" stroke="#eee"/><text x="4" y="338.0" font-size="11" fill="#888">y=200</text>
<line x1="40.0" y1="454.0" x2="544.0" y2="454.0" stroke="#eee"/><text x="4" y="458.0" font-size="11" fill="#888">y=250</text>
<line x1="40.0" y1="574.0" x2="544.0" y2="574.0" stroke="#eee"/><text x="4" y="578.0" font-size="11" fill="#888">y=300</text>
<line x1="40.0" y1="694.0" x2="544.0" y2="694.0" stroke="#eee"/><text x="4" y="698.0" font-size="11" fill="#888">y=350</text>
<line x1="40.0" y1="814.0" x2="544.0" y2="814.0" stroke="#eee"/><text x="4" y="818.0" font-size="11" fill="#888">y=400</text>
<rect id="hand" x="97.60" y="70.00" width="172.80" height="163.20" fill="#ffe0e0" stroke="#c00" stroke-width="2"/>
<text x="103.6" y="88.0" font-size="12" fill="#c00">손 범위(가정) x±36, y≤158</text>
<rect id="flat" x="97.60" y="331.60" width="172.80" height="144.00" fill="#e8f0ff" stroke="#036" stroke-width="2"/>
<text x="103.6" y="349.6" font-size="12" fill="#036">바닥 보드</text>
<rect id="ruler" x="272.80" y="115.60" width="38.40" height="367.20" fill="#ddd" stroke="#555" stroke-width="2"/><text x="317.2" y="142.0" font-size="12" fill="#555">금속 자</text>
<line id="cur_card" x1="419.20" y1="286.00" x2="282.40" y2="646.00" stroke="#bbb" stroke-width="6" stroke-dasharray="6 4"/>
<line id="cur_pat" x1="402.40" y1="331.60" x2="294.40" y2="602.80" stroke="#888" stroke-width="4" stroke-dasharray="6 4"/>
<line id="new_card" x1="419.20" y1="406.00" x2="282.40" y2="766.00" stroke="#c90" stroke-width="8" />
<line id="new_pat" x1="402.40" y1="451.60" x2="294.40" y2="722.80" stroke="#080" stroke-width="5" />
<line id="arrow" x1="356.80" y1="466.00" x2="356.80" y2="586.00" stroke="#06c" stroke-width="3" />
<polygon points="350.8,578.0 362.8,578.0 356.8,588.0" fill="#06c"/>
<text x="424.0" y="530.8" font-size="12" fill="#06c" font-weight="bold">+y로 50 mm 밀기</text><text x="424.0" y="545.8" font-size="12" fill="#06c">(x·기울기 그대로)</text>
<circle id="tip" cx="323.20" cy="367.60" r="5" fill="#c00"/><text x="333.2" y="371.6" font-size="11" fill="#c00">접는 중 손끝 최근접</text><text x="333.2" y="385.6" font-size="11" fill="#c00">(옆 40 mm 포함)</text>
<text x="424.0" y="276.4" font-size="12" fill="#888">지금(점선): 패턴 y 199~312</text>
<text x="337.6" y="746.8" font-size="12" fill="#080" font-weight="bold">목표(실선): 패턴 y 249~362</text>
<text x="20" y="848.0" font-size="12" fill="#333">지금 위치는 시야각 73° 가정의 등록 사진 판독값(판지 끝은 패턴에서 길이 방향으로 +18 mm 연장한 추정). 접는 동작 중 손끝과 판지 사이가</text>
<text x="20" y="864.0" font-size="12" fill="#333">지금 약 25 mm(FK 모델값, 미검증), 50 mm 밀면 약 43 mm. 밀 때 금속 자는 놓인 그대로 두고 보드만 옆으로 민다.</text>
</svg>