<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" font-family="Helvetica, Arial, sans-serif">
<rect width="1280" height="1280" fill="#fff"/>
<text x="40" y="70" font-size="40" font-weight="bold" fill="#212529">열린 손 간격 캘리퍼 재측정 안내 (도식)</text>
<text x="40" y="112" font-size="26" fill="#c92a2a">사진이 아니라 위에서 본 개념 도식입니다. 비율과 모양은 실제와 다릅니다.</text>
<!-- 손목 -->
<rect x="540" y="160" width="200" height="90" fill="#adb5bd" stroke="#495057" stroke-width="3"/>
<text x="560" y="214" font-size="26" fill="#212529">손목 쪽 (팔)</text>
<!-- 손가락 두 개 -->
<rect x="440" y="250" width="70" height="420" fill="#ced4da" stroke="#495057" stroke-width="4"/>
<rect x="770" y="250" width="70" height="420" fill="#ced4da" stroke="#495057" stroke-width="4"/>
<text x="400" y="700" font-size="26" fill="#212529">왼쪽 손가락</text>
<text x="745" y="700" font-size="26" fill="#212529">오른쪽 손가락</text>
<!-- 안쪽 평판(블록이 닿는 면) 강조 -->
<line x1="510" y1="300" x2="510" y2="640" stroke="#12b886" stroke-width="8"/>
<line x1="770" y1="300" x2="770" y2="640" stroke="#12b886" stroke-width="8"/>
<!-- 캘리퍼 -->
<line x1="510" y1="470" x2="770" y2="470" stroke="#e03131" stroke-width="6"/>
<polygon points="510,470 540,455 540,485" fill="#e03131"/><polygon points="770,470 740,455 740,485" fill="#e03131"/>
<text x="548" y="452" font-size="30" fill="#e03131" font-weight="bold">재는 길이 = 간격</text>
<!-- 블록 위치 참고 -->
<rect x="540" y="560" width="200" height="60" fill="none" stroke="#f08c00" stroke-width="4" stroke-dasharray="10 6"/>
<text x="548" y="598" font-size="22" fill="#f08c00">블록이 들어오는 자리(참고)</text>
<!-- 설명 -->
<rect x="0" y="760" width="1280" height="520" fill="#f1f3f5"/>
<text x="40" y="815" font-size="30" font-weight="bold" fill="#212529">재는 곳</text>
<text x="40" y="860" font-size="28" fill="#212529">초록 선 = 두 손가락의 안쪽 평판(블록이 실제로 닿는 면).</text>
<text x="40" y="900" font-size="28" fill="#212529">빨강 화살표 = 이 두 면 사이의 거리를 캘리퍼 바깥 측정 턱이 아니라</text>
<text x="40" y="940" font-size="28" fill="#212529">안쪽 측정 턱(내측)으로 잽니다. 손가락 끝 원통이 아닙니다.</text>
<text x="40" y="1000" font-size="30" font-weight="bold" fill="#212529">조건</text>
<text x="40" y="1044" font-size="28" fill="#212529">· 팔은 정지, 그리퍼는 열린 상태(SDK 100). 현재 열려 있는지는 확인되지 않았습니다.</text>
<text x="40" y="1084" font-size="28" fill="#c92a2a">· 손가락을 손으로 밀거나 벌리지 마세요(서보 손상). 전원은 지금 상태 그대로 둡니다.</text>
<text x="40" y="1124" font-size="28" fill="#212529">· 3회 읽어 값(mm)과 재는 면(평판 안쪽/끝 원통)을 알려 주세요.</text>
<text x="40" y="1164" font-size="28" fill="#212529">· 가능하면 캘리퍼를 댄 모습을 사진으로 한 장 찍어 주세요(측정면 확정용).</text>
</svg>
